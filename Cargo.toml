[package]
name = "binscout"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
dirs = "7.0.0"
goblin = "0.10.7"
md-5 = "0.11.0"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"
which = "8.0.6"
